
<!doctype html>
<html lang="en">

    <meta charset="UTF-8" />

    <!-- Responsive Design -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <!-- Browser Theme -->
    <meta name="theme-color" content="#fff8ed" />
    <meta name="color-scheme" content="light" />
